name: Feature request
description: Suggest an improvement for students or contributors
title: "[Feature]: "
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What you'd want to see happen — not just an implementation.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Possible approach
      description: An implementation idea, if you have one, plus alternatives considered.
  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility areas
      description: Tick every area the proposal might affect.
      options:
        - label: Enabled or disabled class selection
        - label: Conflict detection or lecture exemption
        - label: Saved schedules or legacy local storage
        - label: Shared schedule URLs
        - label: Local calendar dates or calendar export
        - label: Tanrend requests, throttling, or caching
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Examples, mockups, or related issues — no personal schedule data.
