name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Don't include private vulnerability details here — use the security reporting process instead.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I reproduced this on the latest deployed or local version.
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What went wrong and how it affects you.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: The page, actions, and safe subject codes needed.
      placeholder: |
        1. Open ...
        2. Enter DEMO-1 ...
        3. Select ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: input
    id: demo
    attributes:
      label: DEMO reproduction
      description: A DEMO code that reproduces it, if possible. Don't post private schedule links.
      placeholder: DEMO-1
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, deployed or local, and version or commit if known.
      placeholder: |
        Browser:
        Operating system:
        Deployed site or local:
        Version or commit, if known:
    validations:
      required: true
