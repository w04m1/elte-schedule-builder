name: Run Tests

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - dev
      - main

env:
  NPM_VERSION: 11.17.0

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Setup npm
        run: npm install --global "npm@$NPM_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint rules
        run: npm run check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run DEMO browser flow
        run: npm run test:e2e

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --tag elte-schedule-builder:ci .

      - name: Start production image
        run: |
          docker run --detach \
            --name elte-schedule-builder-ci \
            --publish 127.0.0.1:3000:3000 \
            --env CACHE_DB_PATH=:memory: \
            elte-schedule-builder:ci

      - name: Verify DEMO API from the container
        shell: bash
        run: |
          for attempt in {1..30}; do
            if root_headers="$(curl --fail --silent --dump-header - --output /dev/null http://127.0.0.1:3000/)" \
              && api_response="$(curl --fail --silent --dump-header - http://127.0.0.1:3000/api/subject/DEMO-1)" \
              && grep --ignore-case --quiet $'^strict-transport-security: max-age=31536000\r$' <<<"$root_headers" \
              && grep --ignore-case --quiet $'^strict-transport-security: max-age=31536000\r$' <<<"$api_response" \
              && grep --quiet "Introduction to Web Development" <<<"$api_response"; then
              exit 0
            fi
            sleep 1
          done

          docker logs elte-schedule-builder-ci
          exit 1

      - name: Stop production image
        if: always()
        run: docker rm --force elte-schedule-builder-ci || true
