name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  NPM_VERSION: 11.17.0

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"

      - name: Setup npm
        run: npm install --global "npm@$NPM_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint rules
        run: npm run check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build production bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run DEMO browser flow
        run: npm run test:e2e

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create container metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=sha-

      - name: Build and publish container image
        id: container
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.container.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Container image: \`${IMAGE_NAME}:sha-${GITHUB_SHA}\`

          Digest: \`${IMAGE_DIGEST}\`
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes-file release-notes.md
