name: Housekeeping

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Close stale issues and pull requests
        uses: actions/stale@v9
        with:
          stale-issue-message: >-
            This issue has been automatically marked as stale because it has
            not had recent activity. It will be closed if no further activity
            occurs within 14 days. Comment to keep it open.
          stale-pr-message: >-
            This pull request has been automatically marked as stale because it
            has not had recent activity. It will be closed if no further
            activity occurs within 14 days. Comment to keep it open.
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 14
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned,security"
          operations-per-run: 50
          delete-branch: false
